<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الحروف العربية | مِداد</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f7f9ff;
  color:#25253a;
}

header{
  background:#fff;
  border-bottom:1px solid #e7e7f0;
  position:sticky;
  top:0;
  z-index:100;
}

.navbar{
  max-width:1150px;
  margin:auto;
  min-height:72px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#5b50d6;
  font-size:24px;
  font-weight:900;
  text-decoration:none;
}

.logo-icon{
  width:43px;
  height:43px;
  border-radius:14px;
  background:linear-gradient(135deg,#6c63ff,#8e7dff);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.back{
  text-decoration:none;
  background:#f0efff;
  color:#5b50d6;
  padding:11px 17px;
  border-radius:13px;
  font-weight:800;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:40px 18px 70px;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h1{
  font-size:44px;
  margin-bottom:10px;
}

.title h1 span{
  color:#6c63ff;
}

.title p{
  color:#707086;
  font-size:17px;
  line-height:1.8;
}

.display{
  background:#fff;
  border-radius:30px;
  padding:35px 20px;
  min-height:340px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-shadow:0 15px 40px rgba(35,35,75,.08);
  border:1px solid #ececf5;
  margin-bottom:35px;
}

.big-letter{
  width:160px;
  height:160px;
  border-radius:40px;
  background:linear-gradient(135deg,#eeeaff,#e7f8ff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#5b50d6;
  font-size:100px;
  font-weight:900;
  margin-bottom:18px;
}

.word{
  font-size:30px;
  font-weight:900;
  margin-bottom:7px;
}

.description{
  color:#77778b;
  margin-bottom:18px;
}

.listen{
  border:none;
  background:#6c63ff;
  color:#fff;
  padding:13px 22px;
  border-radius:15px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.listen:hover{
  background:#554bd0;
}

.section-title{
  text-align:center;
  margin-bottom:20px;
}

.section-title h2{
  font-size:28px;
}

.letters{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:14px;
}

.letter{
  min-height:105px;
  border:2px solid transparent;
  border-radius:20px;
  background:#fff;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 22px rgba(35,35,75,.07);
  transition:.2s;
}

.letter:hover{
  transform:translateY(-4px);
  border-color:#c9c4ff;
}

.letter.selected{
  background:#f0efff;
  border-color:#6c63ff;
}

.letter-symbol{
  font-size:43px;
  line-height:1;
  font-weight:900;
  color:#303047;
  direction:rtl;
}

.letter.selected .letter-symbol{
  color:#5b50d6;
}

.letter-word{
  margin-top:8px;
  font-size:12px;
  color:#858599;
  font-weight:700;
}

.progress{
  background:#fff;
  border:1px solid #ececf5;
  border-radius:22px;
  margin-top:35px;
  padding:25px;
  text-align:center;
}

.progress h3{
  margin-bottom:12px;
}

.bar{
  height:14px;
  background:#eeeef6;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#6c63ff,#8e7dff);
  transition:.3s;
}

.progress-text{
  margin-top:10px;
  color:#77778b;
  font-size:14px;
}

footer{
  background:#24243a;
  color:#fff;
  text-align:center;
  padding:28px 15px;
}

footer p{
  color:#bdbdce;
  font-size:13px;
}

@media(max-width:900px){

  .letters{
    grid-template-columns:repeat(5,1fr);
  }

}

@media(max-width:600px){

  .title h1{
    font-size:35px;
  }

  .container{
    padding:30px 12px 55px;
  }

  .display{
    min-height:310px;
  }

  .big-letter{
    width:140px;
    height:140px;
    font-size:88px;
  }

  .letters{
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }

  .letter{
    min-height:90px;
  }

  .letter-symbol{
    font-size:35px;
  }

  .letter-word{
    font-size:10px;
  }

}
</style>
</head>

<body>

<header>
  <nav class="navbar">

    <a href="index.html" class="logo">
      <span class="logo-icon">م</span>
      <span>مِداد</span>
    </a>

    <a href="index.html" class="back">
      ← الرئيسية
    </a>

  </nav>
</header>


<main class="container">

  <div class="title">
    <h1>
      الحروف <span>العربية</span>
    </h1>

    <p>
      اختر حرفًا لتتعلم الحرف والكلمة المرتبطة به.
    </p>
  </div>


  <section class="display">

    <div class="big-letter" id="bigLetter">أ</div>

    <div class="word" id="word">أسد</div>

    <div class="description" id="description">
      أ مثل أسد
    </div>

    <button class="listen" onclick="listen()">
      🔊 استمع
    </button>

  </section>


  <div class="section-title">
    <h2>اختر حرفًا</h2>
  </div>


  <section class="letters" id="letters"></section>


  <section class="progress">

    <h3>تقدمك في الحروف</h3>

    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>

    <div class="progress-text" id="progressText">
      تعلمت 0 من 28 حرفًا
    </div>

  </section>

</main>


<footer>
  <p>
    © 2026 مِداد — نتعلم، نكتشف، ونستمتع
  </p>
</footer>


<script>

const data = [

  ["أ","أسد","أ مثل أسد"],
  ["ب","بطة","ب مثل بطة"],
  ["ت","تفاحة","ت مثل تفاحة"],
  ["ث","ثعلب","ث مثل ثعلب"],
  ["ج","جمل","ج مثل جمل"],
  ["ح","حصان","ح مثل حصان"],
  ["خ","خروف","خ مثل خروف"],
  ["د","دب","د مثل دب"],
  ["ذ","ذئب","ذ مثل ذئب"],
  ["ر","رمان","ر مثل رمان"],
  ["ز","زهرة","ز مثل زهرة"],
  ["س","سمكة","س مثل سمكة"],
  ["ش","شمس","ش مثل شمس"],
  ["ص","صقر","ص مثل صقر"],
  ["ض","ضفدع","ض مثل ضفدع"],
  ["ط","طائرة","ط مثل طائرة"],
  ["ظ","ظرف","ظ مثل ظرف"],
  ["ع","عنب","ع مثل عنب"],
  ["غ","غزال","غ مثل غزال"],
  ["ف","فراشة","ف مثل فراشة"],
  ["ق","قمر","ق مثل قمر"],
  ["ك","كتاب","ك مثل كتاب"],
  ["ل","ليمون","ل مثل ليمون"],
  ["م","موز","م مثل موز"],
  ["ن","نحلة","ن مثل نحلة"],
  ["هـ","هلال","هـ مثل هلال"],
  ["و","وردة","و مثل وردة"],
  ["ي","يد","ي مثل يد"]

];


const lettersContainer =
  document.getElementById("letters");

const bigLetter =
  document.getElementById("bigLetter");

const word =
  document.getElementById("word");

const description =
  document.getElementById("description");

const fill =
  document.getElementById("fill");

const progressText =
  document.getElementById("progressText");


let learned =
  JSON.parse(
    localStorage.getItem("midadLetters")
  ) || [];


function createLetters(){

  lettersContainer.innerHTML = "";

  data.forEach((item,index)=>{

    const button =
      document.createElement("button");

    button.type = "button";

    button.className = "letter";

    button.innerHTML = `
      <span class="letter-symbol">
        ${item[0]}
      </span>

      <span class="letter-word">
        ${item[1]}
      </span>
    `;

    if(learned.includes(index)){
      button.classList.add("selected");
    }

    button.onclick = () =>
      chooseLetter(index,button);

    lettersContainer.appendChild(button);

  });

  updateProgress();

}


function chooseLetter(index,button){

  const item = data[index];

  bigLetter.textContent = item[0];

  word.textContent = item[1];

  description.textContent = item[2];


  document
    .querySelectorAll(".letter")
    .forEach(btn =>
      btn.classList.remove("selected")
    );


  button.classList.add("selected");


  if(!learned.includes(index)){

    learned.push(index);

    localStorage.setItem(
      "midadLetters",
      JSON.stringify(learned)
    );

  }


  updateProgress();

  speak(
    item[0] + "، " + item[1]
  );

}


function updateProgress(){

  const percentage =
    (learned.length / data.length) * 100;

  fill.style.width =
    percentage + "%";

  progressText.textContent =
    "تعلمت " +
    learned.length +
    " من " +
    data.length +
    " حرفًا";

}


function speak(text){

  if(!("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(text);

  voice.lang = "ar-SA";

  voice.rate = 0.75;

  voice.pitch = 1;

  speechSynthesis.speak(voice);

}


function listen(){

  speak(
    bigLetter.textContent +
    "، " +
    word.textContent
  );

}


createLetters();

</script>

</body>
</html>
